name: Reporte de error Android
description: Reporta un problema reproducible en la aplicación Android
title: "[Bug Android]: "
assignees: ["tutosrive"]
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudarme a mejorar la aplicación. Completa todos los campos posibles y no incluyas datos sensibles.

  - type: input
    id: android-version
    attributes:
      label: Versión de Android
      description: Indica la versión del sistema operativo Android del teléfono (por ejemplo, Android 14). No introduzcas aquí la versión de la aplicación.
      placeholder: Android 14
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Versión de la aplicación
      description: 'Ve a la sección de "Settings", da click en "About", y verás la versión de la aplicación en un texto asi: `v0.x.x | @tutosrive | ©️ 202x |`.'
      placeholder: 0.5.1
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Modelo del celular
      description: Incluye fabricante y modelo exacto.
      placeholder: Samsung Galaxy A54 5G
    validations:
      required: true

  - type: input
    id: ram
    attributes:
      label: RAM del dispositivo
      description: Indica la memoria RAM disponible o instalada, si la conoces.
      placeholder: 8 GB
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frecuencia del error
      options:
        - Siempre
        - A veces
        - Ocurrió una sola vez
        - No lo sé
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descripción del error
      description: Explica qué ocurrió, qué estabas haciendo y por qué representa un problema.
      placeholder: La aplicación se cierra al...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Pasos para reproducir el error
      description: Escribe los pasos exactos desde que abres la aplicación hasta que aparece el problema.
      placeholder: |
        1. Abre la aplicación.
        2. Ve a...
        3. Pulsa...
        4. Observa que...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Fotos o capturas del error
      description: Arrastra aquí las imágenes o pega sus enlaces. Si no puedes adjuntar ninguna, indica por qué.
      placeholder: Arrastra/Pega las imágenes aquí o pega sus enlaces...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Registros o mensaje de error
      description: Pega el mensaje mostrado o registros relevantes. Elimina antes cualquier dato sensible.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Información adicional
      description: Añade pasos alternativos.
